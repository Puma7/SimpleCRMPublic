packages:
  - "packages/core"
  - "packages/server"
  - "packages/desktop"

# pnpm 10 changed the default of link-workspace-packages to false (requires the
# workspace: protocol). We keep plain semver refs like "@simplecrm/core": "0.1.0"
# so npm's Docker `npm ci` (which does not understand workspace:*) also resolves
# them as local workspace links. This setting restores pnpm's version-based
# workspace linking.
linkWorkspacePackages: true

overrides:
  "@azure/identity@4.13.0": 4.13.1
  "@babel/core@7": 7.29.6
  "@humanfs/node@0.16": 0.16.8
  "@xmldom/xmldom": 0.8.15
  app-builder-bin: 4.2.0
  "axios@1": 1.18.0
  "baseline-browser-mapping@2": 2.11.0
  "brace-expansion@1": 1.1.18
  "brace-expansion@2": 2.1.4
  "brace-expansion@5": 5.0.9
  "browserslist@4": 4.28.7
  dompurify: 3.4.16
  "fast-uri@3": 3.1.8
  "fast-uri@4": 4.1.3
  "find-my-way@9": 9.7.0
  "flatted@3": 3.4.2
  "form-data@4": 4.0.6
  "html-to-text>deepmerge-ts": 8.0.2
  "ip-address@10": 10.3.1
  node-abi: ^4.31.0
  jest-mock: 30.4.1
  jest-runtime: 30.4.2
  jest-circus: 30.4.0
  "joi@18": 18.2.9
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  "nanoid@3": 3.3.18
  nodemailer: 9.1.1
  "picomatch@2": 2.3.2
  "postcss@8": 8.5.23
  "shell-quote@1": 1.9.0
  "tar@7": 7.5.21
  "tmp@0.2": 0.2.7
  "undici@6": 6.28.0
  "undici@7": 7.29.1
  "ws@8": 8.21.0
  "yaml@2": 2.8.3

allowBuilds:
  # embedded-postgres (Integrationstests) stellt per postinstall die Symlinks
  # seiner Postgres-Binaries wieder her. pnpm 11 bricht die Installation ab,
  # wenn ein Build-Skript nicht freigegeben ist - deshalb alle Plattformen, auf
  # denen gebaut oder entwickelt wird (auch der macOS-Release-Job).
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@parcel/watcher": true
  "@swc/core": true
  better-sqlite3@https://codeload.github.com/WiseLibs/better-sqlite3/tar.gz/b5701cb5483d97825778947cb904630c2c2e821e: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tsx@4.23.1
  - postcss@8.5.19
  - react-resizable-panels@4.12.2
